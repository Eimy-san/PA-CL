# =====================================================================
# Phase-2 4th benchmark: Class-IL Split-ImageNet-R, ResNet-18.
#
# ImageNet-R (Hendrycks et al., 2021) contains artistic renditions of
# 200 ImageNet classes, testing robustness to domain shift. Images are
# resized to 64x64 and split 80/20 per class for train/test.
#
# Architecture & schedule:
#   * ResNet-18 (CIFAR variant, 64x64 input, ~11M params)
#   * 10 tasks * 20 classes (sorted class order)
#   * batch_size 64
#   * 30 epochs per task
#   * SGD lr=0.03, momentum=0.9, weight_decay=5e-4
#   * Buffer size 500 for replay methods
#
# Methods (selected at runtime via --method):
#   Baselines:  erm, ewc, er, derpp, agem, er_ace, cls_er, xder  (8)
#   PA-CL:      pacl, pacl_er, pacl_derpp                           (3)
#
# Seeds: 0..4 (5 seeds)
# Wall time estimate (4090): ~20-30 min per seed * 30 epochs * 10 tasks.
# Total ~10-12h for 14 methods * 5 seeds = 70 cells (staggered).
# =====================================================================

experiment_name: imagenet_r_main
out_dir: runbook/imagenet_r_main

dataset:
  name: split_imagenet_r
  root: ./data
  n_tasks: 10
  classes_per_task: 20
  batch_size: 64
  seed: 0
  download: true
  img_size: 64

model:
  name: tinyimagenet_resnet18
  num_classes: 200
  base_width: 64

baseline: erm
baseline_kwargs:
  buffer_size: 500
  buffer_batch: 64
  alpha: 0.5
  beta: 0.5
  lambda_ewc: 10.0
  fisher_samples: 1000
  num_classes: 200
  classes_per_task: 20
  input_shape: [3, 64, 64]

pacl:
  enabled: false
  lam: 0.1
  beta: 0.99
  alpha: 0.9
  tau: 1.0e-4
  layer_names: ["avgpool_tap"]

optimizer:
  name: sgd
  lr: 0.03
  momentum: 0.9
  weight_decay: 5.0e-4

training:
  epochs_per_task: 30
  device: cuda
  log_every: 200
