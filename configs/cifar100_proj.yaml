# =====================================================================
# Ablation 2: Fisher-null projection on/off, PA-CL+ER, Split-CIFAR-100.
#
# Two arms:
#   pacl_er_proj_on  : standard PA-CL+ER (Fisher-null projection applied)
#   pacl_er_proj_off : PA-CL+ER with isotropic rank-gradient update
#                      (cfg.pacl.disable_projection = True)
#
# Seeds: 0, 1, 2 (3 seeds for tight BWT error bars).
# Wall time estimate (4090): ~10-15 min per cell, ~1h total.
#
# Configured at runtime via:
#   --tag pacl_er_proj_on   (default config)
#   --tag pacl_er_proj_off --disable_projection
# =====================================================================

experiment_name: cifar100_proj
out_dir: runbook/cifar100_proj

dataset:
  name: split_cifar100
  root: ./data
  n_tasks: 10
  classes_per_task: 10
  batch_size: 32
  seed: 0
  download: false

model:
  name: cifar_resnet18
  num_classes: 100
  base_width: 64

baseline: er
baseline_kwargs:
  buffer_size: 500
  buffer_batch: 32
  alpha: 1.0

pacl:
  enabled: true
  lam: 0.1
  beta: 0.99
  alpha: 0.9
  tau: 1.0e-4
  layer_names: ["avgpool_tap"]
  disable_projection: false   # default; --disable_projection flips this

optimizer:
  name: sgd
  lr: 0.03
  momentum: 0.9
  weight_decay: 5.0e-4

training:
  epochs_per_task: 20
  device: cuda
  log_every: 200