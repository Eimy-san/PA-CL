# =====================================================================
# Ablation: Replay-buffer scaling on Split-CIFAR-100 / ResNet-18.
#
# Method: pacl_er (PA-CL stacked on Experience Replay).
# Sweep: buffer_size in {0, 100, 200, 500, 2000}.
# Seeds: 0..4 (5 seeds).
#
# buffer_size=0 degenerates to PA-CL alone (no replay).
# Output: runbook/cifar100_buffer/buf_<value>/seed<seed>/...
# =====================================================================

experiment_name: cifar100_buffer
out_dir: runbook/cifar100_buffer

dataset:
  name: split_cifar100
  root: ./data
  n_tasks: 10
  classes_per_task: 10
  batch_size: 32
  seed: 0
  download: false

model:
  name: cifar_resnet18
  num_classes: 100
  base_width: 64

baseline: er
baseline_kwargs:
  buffer_size: 500        # overridden per-cell via --buffer_size
  buffer_batch: 32
  alpha: 1.0

pacl:
  enabled: true
  lam: 0.1
  beta: 0.99
  alpha: 0.9
  tau: 1.0e-4
  layer_names: ["avgpool_tap"]

optimizer:
  name: sgd
  lr: 0.03
  momentum: 0.9
  weight_decay: 5.0e-4

training:
  epochs_per_task: 20
  device: cuda
  log_every: 200
